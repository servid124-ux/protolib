# =============================================================================
# full_reference_template.yml
# Exact (shorthand) equivalent of full_reference_template.json — generated
# with protolib.loader.protocol_dict_to_yaml() from the .json, so they
# serialize/parse byte-for-byte the same. See README.md for the details of
# each pattern.
#
# "types" block: ALL 61 natives registered in protolib/primitives.py (the
# PRIMITIVES dict), grouped in the same families as the source file itself.
# "native" here is just the template's declarative marker -- in practice,
# any name already present in PRIMITIVES works as a native type without
# needing to be declared, but listing them all serves as a quick reference
# catalog: the exact name of each one, without having to go dig through
# the code.
#
# How each one is used in practice: see below, inside
# play.toServer.types.packet_ejemplo_natives -- a container with ONE FIELD
# PER NATIVE, showing how each is referenced from a real packet (field
# name -> type name). That packet is validated with a full roundtrip in
# examples/demo.py.
# =============================================================================
types:
  # -- fixed-width integers, big-endian --
  i8: native
  u8: native
  i16: native
  u16: native
  i32: native
  u32: native
  i64: native
  u64: native
  # -- big-endian floats (f16 = IEEE 754 binary16 / half-float) --
  f16: native
  f32: native
  f64: native
  # -- same integer family, little-endian (RakNet and older protocols) --
  li8: native
  lu8: native
  li16: native
  lu16: native
  li32: native
  lu32: native
  li64: native
  lu64: native
  # -- little-endian floats --
  lf16: native
  lf32: native
  lf64: native
  # -- 3/5/6/7-byte integers, big-endian (not supported by struct) --
  u24: native
  i24: native
  u40: native
  i40: native
  u48: native
  i48: native
  u56: native
  i56: native
  # -- same non-standard widths, little-endian (RakNet: message index,
  #    sequence number, split-packet count travel as 3 LE bytes) --
  lu24: native
  li24: native
  lu40: native
  li40: native
  lu48: native
  li48: native
  lu56: native
  li56: native
  # -- basics --
  bool: native
  void: native
  # -- varints / zigzag (LEB128, Protocol Buffers / Minecraft style) --
  varint: native
  varlong: native
  uvarint: native
  uvarlong: native
  zigzag32: native
  zigzag64: native
  varint128: native
  uvarint128: native
  # -- strings / buffers / UUID --
  cstring: native
  UUID: native
  restBuffer: native
  # -- NBT --
  nbt: native
  optionalNbt: native
  anonymousNbt: native
  anonOptionalNbt: native
  compressedNbt: native
  lpVec3: native
  raknetMagic: native
  # -- Minecraft Classic / ClassiCube: fixed-size strings and buffers --
  string64: native
  utf16be64: native
  buffer1024: native
  buffer64: native
  # -- Minecraft Classic / ClassiCube: fixed-point coordinates (Q10.5) --
  fixedCoord: native
  fixedCoordDelta: native

  # ---- convenience types (not native, built with COMPOSITE types) ----
  string:
    pstring:
      countType: varint
  vec3i16:
    container:
    - name: x
      type: i16
    - name: y
      type: i16
    - name: z
      type: i16
# =============================================================================
# play  (state -- protolib always requires one, even with no real states)
# =============================================================================
play:

  # ---------------------------------------------------------------------------
  # toServer  (client -> server)
  # ---------------------------------------------------------------------------
  toServer:
    types:

      # -----------------------------------------------------------------
      # CATALOG: all 61 natives, one per field. This does not represent
      # any real packet from any protocol -- it's purely for reference,
      # to see the exact name of each native and how it's referenced
      # from a container, all together in one place.
      # `campo_restBuffer` goes last on purpose: restBuffer consumes
      # everything left in the buffer, so any field placed after it
      # would never actually get read.
      # `campo_void` takes up no bytes (fixed 0 bytes) and can go in
      # any position without affecting the rest of the layout.
      # -----------------------------------------------------------------
      packet_ejemplo_natives:
        container:
        # -- fixed-width integers, big-endian --
        - name: campo_u8
          type: u8  # 1 byte, 0 to 255
        - name: campo_i8
          type: i8  # 1 byte, -128 to 127
        - name: campo_u16
          type: u16  # 2 bytes, 0 to 65535
        - name: campo_i16
          type: i16  # 2 bytes, -32768 to 32767
        - name: campo_u24
          type: u24  # 3 bytes, 0 to 16777215
        - name: campo_i24
          type: i24  # 3 bytes, -8388608 to 8388607
        - name: campo_u32
          type: u32  # 4 bytes, 0 to 4294967295
        - name: campo_i32
          type: i32  # 4 bytes, -2147483648 to 2147483647
        - name: campo_u40
          type: u40  # 5 bytes, 0 to 1099511627775
        - name: campo_i40
          type: i40  # 5 bytes, -549755813888 to 549755813887
        - name: campo_u48
          type: u48  # 6 bytes, 0 to 281474976710655
        - name: campo_i48
          type: i48  # 6 bytes, -140737488355328 to 140737488355327
        - name: campo_u56
          type: u56  # 7 bytes, 0 to 72057594037927935
        - name: campo_i56
          type: i56  # 7 bytes, -36028797018963968 to 36028797018963967
        - name: campo_u64
          type: u64  # 8 bytes, 0 to 18446744073709551615
        - name: campo_i64
          type: i64  # 8 bytes, -9223372036854775808 to 9223372036854775807
        # -- big-endian floats --
        - name: campo_f16
          type: f16  # 2 bytes, ~6.1e-5 to 65504, ~3 decimal digits of precision (half-float)
        - name: campo_f32
          type: f32  # 4 bytes, ~1.2e-38 to 3.4e38, ~7 decimal digits of precision
        - name: campo_f64
          type: f64  # 8 bytes, ~2.2e-308 to 1.8e308, 15-17 decimal digits of precision
        # -- same integer family, little-endian --
        - name: campo_lu8
          type: lu8  # 1 byte LE, 0 to 255
        - name: campo_li8
          type: li8  # 1 byte LE, -128 to 127
        - name: campo_lu16
          type: lu16  # 2 bytes LE, 0 to 65535
        - name: campo_li16
          type: li16  # 2 bytes LE, -32768 to 32767
        - name: campo_lu24
          type: lu24  # 3 bytes LE, 0 to 16777215
        - name: campo_li24
          type: li24  # 3 bytes LE, -8388608 to 8388607
        - name: campo_lu32
          type: lu32  # 4 bytes LE, 0 to 4294967295
        - name: campo_li32
          type: li32  # 4 bytes LE, -2147483648 to 2147483647
        - name: campo_lu40
          type: lu40  # 5 bytes LE, 0 to 1099511627775
        - name: campo_li40
          type: li40  # 5 bytes LE, -549755813888 to 549755813887
        - name: campo_lu48
          type: lu48  # 6 bytes LE, 0 to 281474976710655
        - name: campo_li48
          type: li48  # 6 bytes LE, -140737488355328 to 140737488355327
        - name: campo_lu56
          type: lu56  # 7 bytes LE, 0 to 72057594037927935
        - name: campo_li56
          type: li56  # 7 bytes LE, -36028797018963968 to 36028797018963967
        - name: campo_lu64
          type: lu64  # 8 bytes LE, 0 to 18446744073709551615
        - name: campo_li64
          type: li64  # 8 bytes LE, -9223372036854775808 to 9223372036854775807
        # -- little-endian floats --
        - name: campo_lf16
          type: lf16  # 2 bytes LE, ~6.1e-5 to 65504, ~3 decimal digits of precision
        - name: campo_lf32
          type: lf32  # 4 bytes LE, ~1.2e-38 to 3.4e38, ~7 decimal digits of precision
        - name: campo_lf64
          type: lf64  # 8 bytes LE, ~2.2e-308 to 1.8e308, 15-17 decimal digits of precision
        # -- varints / zigzag --
        - name: campo_varint
          type: varint  # 1 to 5 bytes (LEB128), signed 32-bit: -2147483648 to 2147483647
        - name: campo_varlong
          type: varlong  # 1 to 10 bytes (LEB128), signed 64-bit
        - name: campo_uvarint
          type: uvarint  # 1 to 5 bytes (LEB128), unsigned 32-bit: 0 to 4294967295
        - name: campo_uvarlong
          type: uvarlong  # 1 to 10 bytes (LEB128), unsigned 64-bit
        - name: campo_varint128
          type: varint128  # 1 to 19 bytes (LEB128), signed 128-bit (large IDs, truncated hashes)
        - name: campo_uvarint128
          type: uvarint128  # 1 to 19 bytes (LEB128), unsigned 128-bit
        - name: campo_zigzag32
          type: zigzag32  # 1 to 5 bytes, signed 32-bit zigzag-encoded (protobuf-style)
        - name: campo_zigzag64
          type: zigzag64  # 1 to 10 bytes, signed 64-bit zigzag-encoded
        # -- bool / void --
        - name: campo_bool
          type: bool  # 1 byte, 0x00 or 0x01
        - name: campo_void
          type: void  # 0 bytes, takes no space in the buffer
        # -- strings --
        - name: campo_cstring
          type: cstring  # variable, UTF-8 terminated by a 0x00 byte (C-style)
        - name: campo_string64
          type: string64  # 64 fixed bytes, CP437, space-padded (Minecraft Classic)
        - name: campo_utf16be64
          type: utf16be64  # 128 fixed bytes (64 UTF-16BE characters), space-padded
        # -- UUID --
        - name: campo_uuid
          type: UUID  # 16 fixed bytes, big-endian (dashed format is only textual)
        # -- NBT --
        - name: campo_nbt
          type: nbt  # variable, NBT compound WITH a name (root tag has a name)
        - name: campo_optionalNbt
          type: optionalNbt  # variable, like nbt but can be absent (1 flag byte + data)
        - name: campo_anonymousNbt
          type: anonymousNbt  # variable, NBT compound WITHOUT a name (no name field)
        - name: campo_anonOptionalNbt
          type: anonOptionalNbt  # variable, like anonymousNbt but can be absent
        - name: campo_compressedNbt
          type: compressedNbt  # variable, gzip-compressed NBT, i16-length-prefixed (-1 = absent); old (pre-1.20.2) Slot Data item-NBT field
        - name: campo_lpVec3
          type: lpVec3  # 1 or 6+ bytes, quantized {x,y,z} float triple (modern Minecraft relative/delta position fields)
        # -- RakNet (node-raknet, Minecraft Bedrock's transport layer) --
        - name: campo_raknetMagic
          type: raknetMagic  # 16 fixed bytes, constant value -- validates on read, raises MagicMismatchError on mismatch
        - name: campo_raknetAddress
          type: [raknetAddress, {}]  # 7 bytes (IPv4, bit-inverted address) or 29 bytes (IPv6) -- see README section 5
        # -- fixed buffers (Minecraft Classic / ClassiCube) --
        - name: campo_buffer64
          type: buffer64  # 64 fixed bytes, 0x00-padded (PluginMessage data)
        - name: campo_buffer1024
          type: buffer1024  # 1024 fixed bytes, 0x00-padded (Level Data Chunk)
        # -- fixed-point (Minecraft Classic / ClassiCube) --
        - name: campo_fixedCoord
          type: fixedCoord  # 2 bytes (i16), real value = raw / 32 (Q10.5 fixed-point)
        - name: campo_fixedCoordDelta
          type: fixedCoordDelta  # 1 byte (i8), real value = raw / 32 (position delta)
        # -- restBuffer: ALWAYS last, consumes whatever is left --
        - name: campo_restBuffer
          type: restBuffer  # variable, consumes ALL remaining bytes in the buffer
      packet_ejemplo_container:
        container:
        - name: campo_simple
          type: u8
        - name: campo_con_signo
          type: i16
        - name: texto
          type: string
        - name: posicion
          type: vec3i16
      packet_ejemplo_array:
        container:
        - name: cantidad
          type: u8
        - name: lista_tamano_fijo
          type:
            array:
              count: 3
              type: u8
        - name: lista_tamano_prefijado
          type:
            array:
              countType: u8
              type: vec3i16
        - name: lista_referida
          type:
            array:
              count: cantidad
              type: string
      packet_ejemplo_count:
        container:
        - name: longitud_de_datos
          type:
            count:
              type: u8
              countFor: datos
        - name: datos
          type:
            buffer:
              count: longitud_de_datos
      packet_ejemplo_buffer:
        container:
        - name: datos_tamano_fijo
          type:
            buffer:
              count: 16
        - name: datos_prefijados
          type:
            buffer:
              countType: u16
        - name: datos_resto
          type:
            buffer:
              rest: true
      packet_ejemplo_pstring:
        container:
        - name: texto_varint
          type:
            pstring:
              countType: varint
        - name: texto_u8
          type:
            pstring:
              countType: u8
              encoding: utf-8
      packet_ejemplo_option:
        container:
        - name: posicion_opcional
          type:
            option: vec3i16
      packet_ejemplo_bitfield:
        container:
        - name: flags_empaquetadas
          type:
            bitfield:
            - name: modo
              size: 3
              signed: false
            - name: activo
              size: 1
              signed: false
            - name: prioridad
              size: 4
              signed: true
      packet_ejemplo_bitflags:
        container:
        - name: permisos
          type:
            bitflags:
              type: u8
              flags:
                puede_construir: 0
                puede_romper: 1
                puede_volar: 2
              shift: true
      packet_ejemplo_switch_directo:
        container:
        - name: tipo_de_dato
          type: u8
        - name: valor
          type:
            switch:
              compareTo: tipo_de_dato
              fields:
                '0': u8
                '1': i16
                '2': string
              default: restBuffer
      packet:
        container:
        - name: name
          type:
            mapper:
              type: u8
              mappings:
                '0x00': ejemplo_natives
                '0x01': ejemplo_container
                '0x02': ejemplo_array
                '0x03': ejemplo_count
                '0x04': ejemplo_buffer
                '0x05': ejemplo_pstring
                '0x06': ejemplo_option
                '0x07': ejemplo_bitfield
                '0x08': ejemplo_bitflags
                '0x09': ejemplo_switch_directo
        - name: params
          type:
            switch:
              compareTo: name
              fields:
                ejemplo_natives: packet_ejemplo_natives
                ejemplo_container: packet_ejemplo_container
                ejemplo_array: packet_ejemplo_array
                ejemplo_count: packet_ejemplo_count
                ejemplo_buffer: packet_ejemplo_buffer
                ejemplo_pstring: packet_ejemplo_pstring
                ejemplo_option: packet_ejemplo_option
                ejemplo_bitfield: packet_ejemplo_bitfield
                ejemplo_bitflags: packet_ejemplo_bitflags
                ejemplo_switch_directo: packet_ejemplo_switch_directo
  # ---------------------------------------------------------------------------
  # toClient  (server -> client)
  # ---------------------------------------------------------------------------
  toClient:
    types:
      packet_ejemplo_anon:
        container:
        - name: id
          type: u8
        - name: datos_anonimos
          anon: true
          type:
            container:
            - name: x
              type: i16
            - name: y
              type: i16
      packet_ejemplo_condition:
        container:
        - name: tiene_extra
          type: bool
        - name: campo_extra
          condition: fields.tiene_extra === true
          type: string
      packet_ejemplo_array_de_containers:
        container:
        - name: cantidad
          type: u8
        - name: entidades
          type:
            array:
              count: cantidad
              type:
                container:
                - name: entidad_id
                  type: u8
                - name: tipo
                  type: u8
                - name: datos
                  type:
                    switch:
                      compareTo: tipo
                      fields:
                        '0': vec3i16
                        '1': string
      packet_ejemplo_switch_raiz:
        container:
        - name: valor
          type:
            switch:
              compareTo: /modo_global
              fields:
                '0': u8
                '1': i16
      packet_vacio:
        container: []
      packet:
        container:
        - name: name
          type:
            mapper:
              type: u8
              mappings:
                '0x00': ejemplo_anon
                '0x01': ejemplo_condition
                '0x02': ejemplo_array_de_containers
                '0x03': ejemplo_switch_raiz
                '0x04': vacio
        - name: params
          type:
            switch:
              compareTo: name
              fields:
                ejemplo_anon: packet_ejemplo_anon
                ejemplo_condition: packet_ejemplo_condition
                ejemplo_array_de_containers: packet_ejemplo_array_de_containers
                ejemplo_switch_raiz: packet_ejemplo_switch_raiz
                vacio: packet_vacio

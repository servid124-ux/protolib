# =============================================================================
# example_protocol.yml
# Mini protocolo de referencia — muestra los patrones que rompieron el bot,
# y además (patrón 5) un catálogo de TODOS los natives disponibles en
# protolib/primitives.py, cada uno usado como campo real de un packet, para
# que cualquiera que abra este archivo vea de un vistazo cómo se referencia
# cada tipo desde un .yml (nombre exacto, no hace falta ir a buscarlo en el
# código):
#   1) switch con compareTo: ../campo   (subir un nivel al padre real)
#   2) array de containers con switch adentro (anon: true)
#   3) tipo NOMBRADO parametrizable con $arg (como entityMetadataItem)
#   4) container con bitfield empaquetado en 1 byte + switch por ese campo
#   5) packet_ejemplo_natives — los 61 natives de primitives.py, uno por campo
# =============================================================================

types:
  # ---- tipos base ya usados en los patrones 1-4 de abajo ----
  varint: native
  u8: native
  i8: native
  i16: native
  i32: native
  f32: native
  bool: native
  UUID: native
  container: native
  switch: native
  array: native
  bitfield: native
  option: native
  void: native

  # ---------------------------------------------------------------------
  # PATRÓN 5: el resto de los natives de primitives.py (61 en total, los
  # 14 de arriba ya cuentan). Agrupados igual que en primitives.py / el
  # README (sección 5) para que sea fácil comparar uno a uno.
  # ---------------------------------------------------------------------
  # -- enteros de ancho fijo, big-endian, que faltaban --
  u24: native
  i24: native
  u40: native
  i40: native
  u48: native
  i48: native
  u56: native
  i56: native
  u64: native
  i64: native
  # -- floats --
  f16: native
  f64: native
  # -- misma familia, little-endian (l + nombre) --
  lu8: native
  li8: native
  lu16: native
  li16: native
  lu24: native
  li24: native
  lu32: native
  li32: native
  lu40: native
  li40: native
  lu48: native
  li48: native
  lu56: native
  li56: native
  lu64: native
  li64: native
  lf16: native
  lf32: native
  lf64: native
  # -- varints / zigzag --
  varlong: native
  uvarint: native
  uvarlong: native
  varint128: native
  uvarint128: native
  zigzag32: native
  zigzag64: native
  # -- strings / buffers --
  cstring: native
  restBuffer: native
  string64: native
  utf16be64: native
  buffer1024: native
  buffer64: native
  # -- NBT --
  nbt: native
  optionalNbt: native
  anonymousNbt: native
  anonOptionalNbt: native
  # -- ClassiCube fixed-point --
  fixedCoord: native
  fixedCoordDelta: native

  string:
    pstring:
      countType: varint

  # ---------------------------------------------------------------------
  # PATRÓN 1: tipo nombrado PARAMETRIZABLE con $arg
  # ---------------------------------------------------------------------
  # Se define UNA vez con un placeholder "$compareTo" (el nombre después
  # del $ es arbitrario, vos elegís cómo llamarlo).
  # Quien lo USE más abajo decide el valor real de compareTo en ese punto.
  # Esto es EXACTAMENTE cómo minecraft-data define entityMetadataItem.
  itemPorTipo:
    switch:
      compareTo: $compareTo     # <- placeholder, se sustituye al usarlo
      fields:
        '0': i8
        '1': i16
        '2': i32
        '3': f32
        '4': string
        '5':
          container:
          - name: x
            type: i32
          - name: y
            type: i32
          - name: z
            type: i32

  # ---------------------------------------------------------------------
  # PATRÓN 4: entrada con bitfield empaquetado en 1 byte + switch
  # ---------------------------------------------------------------------
  # Un solo byte trae DOS campos empaquetados (tipo de dato + índice).
  # El container los separa con bitfield, y el switch usa el campo `tipo`
  # (que vive en el MISMO container, leído recién arriba) para decidir el
  # tipo del campo `valor` — invocando itemPorTipo con su $compareTo real.
  entradaMetadata:
    container:
    - anon: true              # sus sub-campos (tipo, indice) se mezclan
      type:                   # directo en el container padre, no anidan
        bitfield:              # un dict nuevo
        - name: tipo
          size: 3
          signed: false
        - name: indice
          size: 5
          signed: false
    - name: valor
      type:
      - itemPorTipo            # <- tipo nombrado parametrizable
      - compareTo: tipo        # <- acá se resuelve el $compareTo = "tipo"

  # ---------------------------------------------------------------------
  # PATRÓN 2: array de containers, con un switch adentro que necesita
  # mirar un campo del container PADRE del array (no del item)
  # ---------------------------------------------------------------------
  entradaJugador:
    container:
    - name: uuid
      type: UUID
    - anon: true
      type:
        switch:
          # ../accion sube UN nivel: sale de este container-item (que
          # solo tiene `uuid`) y llega al container que contiene el
          # array (packet_ejemplo_jugadores, más abajo), donde SÍ existe
          # el campo `accion`.
          #
          # OJO: esto solo funciona si entradaJugador se usa INLINE como
          # item_type de un array (ver más abajo, "type: container: ...")
          # y NO como tipo nombrado aparte -- un tipo nombrado (como este
          # mismo bloque, definido con nombre "entradaJugador") SIEMPRE
          # empuja su propio nivel de "..", así que si lo referenciás por
          # nombre (type: entradaJugador) el ../accion de acá adentro NO
          # llega a accion, porque el nivel que salta cae en ESTE mismo
          # container, no en el padre real. Por eso packet_ejemplo_jugadores
          # más abajo declara el container INLINE en vez de referenciar
          # este tipo por nombre. Dejamos este bloque solo como referencia
          # de la forma, no se usa directo.
          compareTo: ../accion
          fields:
            agregar:
              container:
              - name: nombre
                type: string
            quitar: void

  packet_ejemplo_jugadores:
    container:
    - name: accion
      type:
        mapper:
          type: varint
          mappings:
            '0': agregar
            '1': quitar
    - name: jugadores
      type:
        array:
          countType: varint
          type:
            # INLINE, no "type: entradaJugador" -- así el array-item no
            # empuja nivel propio y ../accion llega al container de arriba.
            container:
            - name: uuid
              type: UUID
            - anon: true
              type:
                switch:
                  compareTo: ../accion
                  fields:
                    agregar:
                      container:
                      - name: nombre
                        type: string
                    quitar: void

  # ejemplo de paquete "metadata de entidad" usando el patrón 1+4 juntos
  packet_ejemplo_metadata:
    container:
    - name: entityId
      type: varint
    - name: metadata
      type:
        array:
          countType: varint
          type: entradaMetadata

  # ---------------------------------------------------------------------
  # PATRÓN 5: catálogo de TODOS los natives, un campo por cada uno de los
  # 61 registrados en primitives.py. No representa ningún paquete real de
  # ningún protocolo -- es puramente de referencia, para ver el nombre
  # exacto de cada native y un valor de ejemplo válido en un solo lugar.
  # `restBuffer` va al final a propósito: consume todo lo que quede en el
  # buffer, así que cualquier campo después de él nunca se llegaría a leer.
  # `voidField` no ocupa bytes (0 bytes fijo) y puede ir en cualquier
  # posición sin afectar el resto del layout.
  # ---------------------------------------------------------------------
  packet_ejemplo_natives:
    container:
    # -- enteros de ancho fijo, big-endian --
    - {name: campo_u8,  type: u8}
    - {name: campo_i8,  type: i8}
    - {name: campo_u16, type: u16}
    - {name: campo_i16, type: i16}
    - {name: campo_u24, type: u24}
    - {name: campo_i24, type: i24}
    - {name: campo_u32, type: u32}
    - {name: campo_i32, type: i32}
    - {name: campo_u40, type: u40}
    - {name: campo_i40, type: i40}
    - {name: campo_u48, type: u48}
    - {name: campo_i48, type: i48}
    - {name: campo_u56, type: u56}
    - {name: campo_i56, type: i56}
    - {name: campo_u64, type: u64}
    - {name: campo_i64, type: i64}
    # -- floats --
    - {name: campo_f16, type: f16}
    - {name: campo_f32, type: f32}
    - {name: campo_f64, type: f64}
    # -- misma familia, little-endian --
    - {name: campo_lu8,  type: lu8}
    - {name: campo_li8,  type: li8}
    - {name: campo_lu16, type: lu16}
    - {name: campo_li16, type: li16}
    - {name: campo_lu24, type: lu24}
    - {name: campo_li24, type: li24}
    - {name: campo_lu32, type: lu32}
    - {name: campo_li32, type: li32}
    - {name: campo_lu40, type: lu40}
    - {name: campo_li40, type: li40}
    - {name: campo_lu48, type: lu48}
    - {name: campo_li48, type: li48}
    - {name: campo_lu56, type: lu56}
    - {name: campo_li56, type: li56}
    - {name: campo_lu64, type: lu64}
    - {name: campo_li64, type: li64}
    - {name: campo_lf16, type: lf16}
    - {name: campo_lf32, type: lf32}
    - {name: campo_lf64, type: lf64}
    # -- varints / zigzag --
    - {name: campo_varint,     type: varint}
    - {name: campo_varlong,    type: varlong}
    - {name: campo_uvarint,    type: uvarint}
    - {name: campo_uvarlong,   type: uvarlong}
    - {name: campo_varint128,  type: varint128}
    - {name: campo_uvarint128, type: uvarint128}
    - {name: campo_zigzag32,   type: zigzag32}
    - {name: campo_zigzag64,   type: zigzag64}
    # -- bool / void --
    - {name: campo_bool, type: bool}
    - {name: campo_void, type: void}
    # -- strings --
    - {name: campo_cstring, type: cstring}
    - {name: campo_string64, type: string64}
    - {name: campo_utf16be64, type: utf16be64}
    # -- UUID --
    - {name: campo_uuid, type: UUID}
    # -- NBT --
    - {name: campo_nbt, type: nbt}
    - {name: campo_optionalNbt, type: optionalNbt}
    - {name: campo_anonymousNbt, type: anonymousNbt}
    - {name: campo_anonOptionalNbt, type: anonOptionalNbt}
    # -- buffers fijos (ClassiCube) --
    - {name: campo_buffer64, type: buffer64}
    - {name: campo_buffer1024, type: buffer1024}
    # -- fixed-point (ClassiCube) --
    - {name: campo_fixedCoord, type: fixedCoord}
    - {name: campo_fixedCoordDelta, type: fixedCoordDelta}
    # -- restBuffer: SIEMPRE al final, se come todo lo que quede --
    - {name: campo_restBuffer, type: restBuffer}

# =============================================================================
# Estados/direcciones — protodef siempre necesita un scope (state.direction)
# para saber qué tipos usar en cada fase de la conexión.
# =============================================================================
play:
  toClient:
    types:
      packet:
        container:
        - name: name
          type:
            mapper:
              type: varint
              mappings:
                '0x00': ejemplo_jugadores
                '0x01': ejemplo_metadata
                '0x02': ejemplo_natives
        - name: params
          type:
            switch:
              compareTo: name
              fields:
                ejemplo_jugadores: packet_ejemplo_jugadores
                ejemplo_metadata: packet_ejemplo_metadata
                ejemplo_natives: packet_ejemplo_natives

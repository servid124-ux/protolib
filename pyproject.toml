[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "protolib"
version = "0.3.3"
description = "Pure-Python, from-scratch declarative binary protocol (de)serializer — node-protodef style, for Minecraft, ClassiCube and any other binary protocol."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "R" },
]
keywords = [
    "protocol",
    "binary",
    "serialization",
    "minecraft",
    "classicube",
    "protodef",
    "networking",
    "packet",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
    "Topic :: Games/Entertainment",
]
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
dev = ["pytest>=7.0", "pyyaml>=6.0"]

# Descomentar y completar cuando el repo esté publicado en GitHub:
# [project.urls]
# Homepage = "https://github.com/tu-usuario/protolib"
# Repository = "https://github.com/tu-usuario/protolib"
# Issues = "https://github.com/tu-usuario/protolib/issues"

[tool.setuptools.packages.find]
include = ["protolib*"]
exclude = ["examples*"]

[tool.setuptools.package-data]
# Sin esto, py.typed queda en el repo pero NO se empaqueta en el wheel/sdist
# -- el marker PEP 561 tiene que viajar adentro del paquete instalado para
# que mypy/pyright lo vean.
protolib = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "protolib"
version = "0.4.3"
description = "Pure-Python, from-scratch declarative binary protocol (de)serializer — node-protodef style YAML/JSON for any binary protocol, plus real Google Protocol Buffers (.proto) parsing and wire-format support."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "R" },
]
keywords = [
    "protocol",
    "binary",
    "serialization",
    "protodef",
    "protobuf",
    "networking",
    "packet",
    "codec",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
]
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
dev = ["pytest>=7.0", "pyyaml>=6.0"]

# Repo published on GitHub:
[project.urls]
Homepage = "https://github.com/servid124-ux/protolib"
Repository = "https://github.com/servid124-ux/protolib"
Issues = "https://github.com/servid124-ux/protolib/issues"

[tool.setuptools.packages.find]
include = ["protolib*"]
exclude = ["examples*"]

[tool.setuptools.package-data]
# Without this, py.typed stays in the repo but is NOT packaged into the
# wheel/sdist -- the PEP 561 marker has to ship inside the installed
# package for mypy/pyright to see it.
protolib = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
